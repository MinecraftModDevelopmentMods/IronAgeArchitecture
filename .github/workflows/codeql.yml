name: CodeQL
on:
  push:
    branches: [master-1.10, 'feature/**']
  pull_request:
    branches: [master-1.10]
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the Java 8 compiler
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - name: Install the Mavenizer runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install the Gradle runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Compile the mod for analysis
        run: >-
          bash ./gradlew clean classes --no-daemon --no-build-cache --rerun-tasks
          --console=plain --max-workers=2
          -Porg.gradle.java.installations.paths="$JAVA_HOME,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64"
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.auto-download=false
      - uses: github/codeql-action/analyze@v4
