name: Build
on:
  push:
    branches: [master-1.10, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the Java 8 compiler
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - name: Install the Mavenizer runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Build, test and check the packaged files
        run: >-
          bash ./gradlew clean check build javadoc auditArtifacts prepareProbe
          --no-daemon --console=plain --max-workers=2
          -Porg.gradle.java.installations.paths="$JAVA_HOME,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64"
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.auto-download=false
      - uses: actions/upload-artifact@v4
        with:
          name: iron-age-architecture-1.10.2
          path: build/libs/*
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
